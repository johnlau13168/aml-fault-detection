# CI Risk Gate -- GitHub Flow governance for aml-fault-detection.
#
# Triggers on pull_request -> main and push -> main.
# Blocking jobs (required status checks):
#   * secret-scan   : gitleaks (HKSAR S17 secret hygiene)
#   * ruff-lint     : static analysis
#   * risk-gate-tests: pytest unit + boundary tests (FS-01/FS-02/FS-03)
# Any failure marks the check red -> branch protection blocks the merge.

name: CI Risk Gate (BRS-AML-104 / FS-AML-104)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks / HKSAR S17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback gitleaks CLI scan (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.6
      - name: Ruff check (blocking)
        run: python -m ruff check src tests

  risk-gate-tests:
    name: Risk Gate Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=9,<10"

      - name: Run unit + boundary tests (blocking)
        run: python -m pytest -v --junitxml=pytest-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 30

  # Aggregating job: branch protection requires only this check, and it fails
  # if ANY gate above failed -- this is the merge-blocking "risk gate".
  merge-gate:
    name: Merge Risk Gate (blocks merge on failure)
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, risk-gate-tests]
    if: always()
    steps:
      - name: Evaluate gate results
        run: |
          echo "secret-scan=${{ needs.secret-scan.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "risk-gate-tests=${{ needs.risk-gate-tests.result }}"
          if [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.risk-gate-tests.result }}" != "success" ]; then
            echo "::error::Risk gate failed - merge blocked (HKSAR S17 / BRS-AML-104)"
            exit 1
          fi
          echo "All gates passed."
