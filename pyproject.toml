[project]
name = "aml-fault-detection"
version = "0.1.0"
description = "AML & Fault Detection engine (BRS-AML-104 / FS-AML-104) for SWIFT MT103 outward wires"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
